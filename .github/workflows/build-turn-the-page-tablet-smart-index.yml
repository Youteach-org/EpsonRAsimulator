name: Turn the Page Tablet v2 - indice y modo nocturno

on:
  push:
    branches: [build/turn-the-page-tablet-armando-anota]
    paths:
      - .github/workflows/build-turn-the-page-tablet-smart-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Recuperar fuente original publicada en F-Droid
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 12 --max-time 100 \
            https://codeload.sourcecraft.tech/avstaim/listai/tarball/refs/heads/main -o src.tar.gz || \
          curl --fail --location --retry 2 --retry-all-errors \
            https://f-droid.org/repo/com.avstaim.listai_35_src.tar.gz -o src.tar.gz
          mkdir -p lector
          tar -xzf src.tar.gz -C lector --strip-components=1

      - name: Restaurar correccion de orientacion y autoria
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("lector")
          layout=root/"feature/reader/src/main/kotlin/com/avstaim/listai/feature/reader/bookview/AdaptiveBookLayout.kt"
          s=layout.read_text()
          token="    // Width alone is not enough: an extremely short multi-window"
          assert s.count(token)==1
          layout.write_text(s.replace(token,
            "    if (canvasHeight > canvasWidth) return BookPresentation.SINGLE\n\n"+token))
          app=root/"app/build.gradle.kts"
          s=app.read_text()
          token='applicationId = "com.avstaim.listai"'
          assert s.count(token)==1
          # A distinct package is necessary because the former debug build was signed
          # with an ephemeral key. Do not delete the original reader or its local books.
          app.write_text(s.replace(token,'applicationId = "com.avstaim.listai.tablet.armando.smart"'))
          manifest=root/"app/src/main/AndroidManifest.xml"
          ms=manifest.read_text()
          assert ms.count('android:launchMode="singleTop"') == 1
          manifest.write_text(ms.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"', 1))
          settings=root/"feature/reader/src/main/kotlin/com/avstaim/listai/feature/reader/PaperReaderInsert.kt"
          s=settings.read_text()
          token="                Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {"
          assert token in s
          settings.write_text(s.replace(token, token+
             '\n                    Text("por Armando Anota", style = MaterialTheme.typography.labelSmall, color = colors.onSurfaceVariant)\n',1))
          for res in (root/"app/src/main/res").glob("values*/strings.xml"):
              s=res.read_text()
              token='<string name="app_name">'
              assert token in s
              import re
              res.write_text(re.sub(r'<string name="app_name">[^<]*</string>',
                '<string name="app_name">Turn the Page Armando Anota</string>',s,count=1))
          PY

      - name: Aplicar indice inteligente y colores invertidos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          base64 --decode .github/patches/turnthepage_v2_patch.b64 | xz -d > stage/smart.tar
          tar -xf stage/smart.tar -C stage
          sed -i "s@Path(__file__).resolve().parent / 'PdfSmartIndex.kt'.read_bytes()@(Path(__file__).resolve().parent / 'PdfSmartIndex.kt').read_bytes()@" stage/apply_v2.py
          sed -i "s@Path(__file__).resolve().parent / 'PdfIndexPanel.kt'.read_bytes()@(Path(__file__).resolve().parent / 'PdfIndexPanel.kt').read_bytes()@" stage/apply_v2.py
          python3 stage/apply_v2.py lector
          python3 - <<'PY'
          from pathlib import Path
          f=Path("lector/feature/reader/src/main/kotlin/com/avstaim/listai/feature/reader/PdfSmartIndex.kt")
          s=f.read_text()
          s=s.replace('val parsed = extractIndexLines(listOf(words))',
              'val parsed = extractIndexLines(listOf(if (seenIndex) "Índice\\n$words" else words))')
          s=s.replace('val target = runCatching { item.findDestinationPage(document) }.getOrNull()',
              'val current = item\n                        val target = runCatching { current.findDestinationPage(document) }.getOrNull()')
          s=s.replace('inferShiftFromText(textPages, pages)', 'inferShiftFromText(textPages ?: emptyList(), pages)')
          f.write_text(s)
          PY

      - name: Habilitar zoom PDF dentro del libro y paso sin cerrar visor
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/patches/inline_pdf_zoom_patch.gz.b64 | gzip -d > stage/inline_zoom.py
          python3 stage/inline_zoom.py lector
          grep -q "inlinePdfZoom" lector/feature/reader/src/main/kotlin/com/avstaim/listai/feature/reader/bookview/PhysicalBookView.kt
          grep -q "onPdfPageZoom = null" lector/feature/reader/src/main/kotlin/com/avstaim/listai/feature/reader/ReaderDemoScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-disabled: true

      - name: Compilar APK
        working-directory: lector
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK para instalacion automatica
        shell: bash
        run: |
          set -euo pipefail
          test -s lector/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk
          cp lector/app/build/outputs/apk/debug/app-debug.apk apk/TurnThePage_Tablet_ArmandoAnota_Smart.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/TurnThePage_Tablet_ArmandoAnota_Smart.apk
          git commit -m "Publish smart PDF index and night-reader APK"
          git push origin HEAD:build/turn-the-page-tablet-armando-anota
          sha256sum apk/TurnThePage_Tablet_ArmandoAnota_Smart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TurnThePage-Tablet-Smart-APK
          path: apk/TurnThePage_Tablet_ArmandoAnota_Smart.apk
          if-no-files-found: error
