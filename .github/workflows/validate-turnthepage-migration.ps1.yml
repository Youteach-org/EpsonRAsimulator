name: Validate TurnThePage migration PowerShell
on:
  push:
    branches:
      - build/turn-the-page-tablet-armando-anota
    paths:
      - .github/workflows/validate-turnthepage-migration.ps1.yml
      - scripts/instalar_turnthepage_migracion_push_sha.ps1
  workflow_dispatch:
jobs:
  parse-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse without executing installation
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/instalar_turnthepage_seguro_v3.ps1",
            [ref]$tokens, [ref]$parseErrors
          )
          if ($null -eq $ast -or $parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          $code = Get-Content "scripts/instalar_turnthepage_migracion_push_sha.ps1" -Raw
          if ($code.Contains("dd of=") -or $code.Contains('uninstall $oldPackage') -or
              -not $code.Contains('-d push') -or
              -not $code.Contains('Device-Sha') -or
              -not $code.Contains('exec-out run-as')) {
            throw "Missing safe transfer/verification or unsafe removal of old app."
          }
          Write-Host "PowerShell syntax and safe-migration checks passed."
