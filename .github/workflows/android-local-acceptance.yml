name: Android local project acceptance
on:
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/android-local-acceptance.yml'
      - '.github/scripts/android-local-acceptance.sh'
      - '.github/scripts/decode-acceptance-evidence.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-local-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        stage: [core, tcp]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM on isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build acceptance APKs before starting emulator
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Run UI acceptance on fresh emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # SceneView preview CI documents first-Filament-viewport failure with SwiftShader GLES.
          # Use its working ANGLE-over-SwiftShader backend (sceneview/sceneview issue #3554).
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-local-acceptance.sh ${{ matrix.stage }}
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-project-acceptance-${{ matrix.stage }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/acceptance-diagnostics/
          if-no-files-found: warn
